<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Gry 1-3-4-3 | Olimpia Grudziądz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    
    /* Zastępcze tło imitujące tablicę taktyczną */
    .tactical-pitch {
      background-color: #1e293b;
      background-image: 
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 20px 20px;
    }
  </style>
</head>
<body class="text-slate-100 font-sans antialiased custom-scrollbar h-screen flex overflow-hidden">

  <!-- Sidebar / Nawigacja -->
  <aside class="w-64 bg-slate-950 border-r border-slate-800 flex flex-col h-full flex-shrink-0 z-10 hidden md:flex">
    <div class="p-6 border-b border-slate-800 flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-slate-950">
        OG
      </div>
      <div>
        <h1 class="font-bold text-sm text-white tracking-wide">AKADEMIA OLIMPIA</h1>
        <p class="text-xs text-cyan-400 font-mono">SYSTEM 1-3-4-3</p>
      </div>
    </div>
    <div class="p-4">
      <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4">Wybierz Pozycję</p>
      <nav id="menu-container" class="space-y-2"></nav>
    </div>
  </aside>

  <!-- Mobilne Menu (widoczne tylko na telefonach) -->
  <div class="md:hidden fixed top-0 w-full bg-slate-950 border-b border-slate-800 z-20 p-4 flex justify-between items-center">
    <span class="font-bold text-sm text-white">OLIMPIA 1-3-4-3</span>
    <select id="mobile-menu" class="bg-slate-800 text-white text-xs p-2 rounded border border-slate-700 w-1/2"></select>
  </div>

  <!-- Główny Kontent -->
  <main class="flex-1 h-full overflow-y-auto p-4 pt-20 md:pt-8 pb-12 relative bg-slate-900">
    <div id="loading" class="flex justify-center items-center h-full">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-cyan-500"></div>
    </div>

    <div id="content" class="max-w-5xl mx-auto hidden">
      <!-- Nagłówek Pozycji -->
      <div class="flex flex-col md:flex-row md:items-end justify-between mb-8">
        <div>
          <span id="pos-id" class="text-cyan-400 font-mono text-xs font-semibold tracking-widest uppercase bg-cyan-950/60 border border-cyan-800/60 px-3 py-1 rounded-full mb-3 inline-block"></span>
          <h2 id="pos-name" class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mt-2"></h2>
        </div>
        <div class="mt-4 md:mt-0">
          <span class="text-xs text-slate-400 uppercase tracking-wider mr-2">Numery na boisku:</span>
          <span id="pos-numbers" class="text-xl font-black text-white bg-slate-800 px-4 py-1 rounded-lg border border-slate-700"></span>
        </div>
      </div>

      <!-- Zastępcze Wideo / Grafika -->
      <div class="glass-card rounded-xl overflow-hidden mb-8 h-64 md:h-80 tactical-pitch relative flex items-center justify-center border border-slate-700 shadow-2xl">
        <div class="text-center">
          <div class="w-16 h-16 bg-slate-800/80 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg border border-slate-600">
            <i class="fa-solid fa-play text-cyan-400 text-xl pl-1"></i>
          </div>
          <p class="text-sm font-bold text-white tracking-wide">MIEJSCE NA WIDEO TAKTYCZNE</p>
          <p id="pos-anim-desc" class="text-xs text-slate-400 mt-2 max-w-md px-4"></p>
        </div>
      </div>

      <!-- Sekcje: GPS, Atak, Obrona -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Profil GPS -->
        <div class="glass-card rounded-xl p-6 border-t-4 border-amber-500">
          <div class="flex items-center space-x-2 mb-4">
            <i class="fa-solid fa-stopwatch text-amber-400"></i>
            <h3 class="font-bold text-white text-sm uppercase tracking-wider">Profil GPS (90 min)</h3>
          </div>
          <div class="space-y-4">
            <div>
              <div class="text-xs text-slate-400 mb-1">Dystans Całkowity</div>
              <div id="gps-dist" class="text-xl font-mono font-bold text-white bg-slate-800/50 px-3 py-1 rounded border border-slate-700/50 inline-block"></div>
            </div>
            <div>
              <div class="text-xs text-slate-400 mb-1">Biegi HSR (>19.8 km/h)</div>
              <div id="gps-hsr" class="text-xl font-mono font-bold text-amber-400 bg-slate-800/50 px-3 py-1 rounded border border-slate-700/50 inline-block"></div>
            </div>
            <div>
              <div class="text-xs text-slate-400 mb-1">Sprinty (>25.2 km/h)</div>
              <div id="gps-sprint" class="text-xl font-mono font-bold text-white bg-slate-800/50 px-3 py-1 rounded border border-slate-700/50 inline-block"></div>
            </div>
            <div class="pt-2 border-t border-slate-700/50">
              <p id="gps-spec" class="text-xs text-slate-300 leading-relaxed"></p>
            </div>
          </div>
        </div>

        <!-- Obrona -->
        <div class="glass-card rounded-xl p-6 border-t-4 border-cyan-500 md:col-span-2">
          <div class="flex items-center space-x-2 mb-4">
            <i class="fa-solid fa-shield-halved text-cyan-400"></i>
            <h3 class="font-bold text-white text-sm uppercase tracking-wider">Zadania: Faza Obrony</h3>
          </div>
          <div class="bg-slate-900/50 rounded-lg p-4 border border-slate-800">
            <ul id="list-defense" class="space-y-3 text-sm text-slate-300"></ul>
          </div>

          <div class="flex items-center space-x-2 mb-4 mt-6">
            <i class="fa-solid fa-khanda text-emerald-400"></i>
            <h3 class="font-bold text-white text-sm uppercase tracking-wider">Zadania: Faza Ataku</h3>
          </div>
          <div class="bg-slate-900/50 rounded-lg p-4 border border-slate-800">
            <ul id="list-attack" class="space-y-3 text-sm text-slate-300"></ul>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script>
    let globalData = [];

    // Pobranie danych JSON
    fetch('model_gry_1343.json')
      .then(res => res.json())
      .then(data => {
        globalData = data.pozycje;
        buildMenu(globalData);
        // Domyślnie ładujemy pierwszego zawodnika z listy
        loadPlayer(0);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').classList.remove('hidden');
      })
      .catch(err => {
        document.getElementById('loading').innerHTML = '<p class="text-red-400 text-sm">Błąd ładowania pliku model_gry_1343.json. Upewnij się, że plik istnieje w repozytorium i ma poprawną strukturę.</p>';
      });

    // Budowanie menu bocznego i mobilnego
    function buildMenu(pozycje) {
      const menuContainer = document.getElementById('menu-container');
      const mobileMenu = document.getElementById('mobile-menu');

      pozycje.forEach((pos, index) => {
        // Desktop Menu
        const btn = document.createElement('button');
        btn.className = 'w-full text-left px-4 py-3 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:bg-slate-800 hover:text-white menu-btn';
        btn.innerHTML = `<span class="text-cyan-500 mr-2 font-mono text-xs w-6 inline-block">${pos.id_pozycji.toUpperCase()}</span> ${pos.nazwa}`;
        btn.onclick = () => {
          setActiveMenu(index);
          loadPlayer(index);
        };
        menuContainer.appendChild(btn);

        // Mobile Menu
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = pos.nazwa;
        mobileMenu.appendChild(opt);
      });

      mobileMenu.addEventListener('change', (e) => {
        const idx = e.target.value;
        setActiveMenu(idx);
        loadPlayer(idx);
      });
    }

    function setActiveMenu(index) {
      const btns = document.querySelectorAll('.menu-btn');
      btns.forEach((b, i) => {
        if (i == index) {
          b.classList.add('bg-cyan-900/30', 'text-white', 'border', 'border-cyan-800/50');
          b.classList.remove('text-slate-400');
        } else {
          b.classList.remove('bg-cyan-900/30', 'text-white', 'border', 'border-cyan-800/50');
          b.classList.add('text-slate-400');
        }
      });
      document.getElementById('mobile-menu').value = index;
    }

    // Ładowanie konkretnego profilu zawodnika
    function loadPlayer(index) {
      const player = globalData[index];
      if(!player) return;

      document.getElementById('pos-id').textContent = 'Rola: ' + player.id_pozycji;
      document.getElementById('pos-name').textContent = player.nazwa;
      document.getElementById('pos-numbers').textContent = player.numery;

      // Opis placeholderu na wideo
      document.getElementById('pos-anim-desc').textContent = player.multimedia.opis_animacji || "Wkrótce wideo z analizą boiskową.";

      // GPS
      document.getElementById('gps-dist').textContent = player.obciazenia_gps.dystans_km;
      document.getElementById('gps-hsr').textContent = player.obciazenia_gps.hsr_m;
      document.getElementById('gps-sprint').textContent = player.obciazenia_gps.sprinty_m;
      document.getElementById('gps-spec').textContent = player.obciazenia_gps.specyfika;

      // Obrona
      const defUl = document.getElementById('list-defense');
      defUl.innerHTML = '';
      player.taktyka_obrona.forEach(item => {
        const li = document.createElement('li');
        li.className = "flex items-start";
        li.innerHTML = `<i class="fa-solid fa-check text-cyan-500 mt-1 mr-3 text-xs"></i> <span>${item}</span>`;
        defUl.appendChild(li);
      });

      // Atak
      const attUl = document.getElementById('list-attack');
      attUl.innerHTML = '';
      player.taktyka_atak.forEach(item => {
        const li = document.createElement('li');
        li.className = "flex items-start";
        li.innerHTML = `<i class="fa-solid fa-arrow-right text-emerald-500 mt-1 mr-3 text-xs"></i> <span>${item}</span>`;
        attUl.appendChild(li);
      });
    }
  </script>
</body>
</html>

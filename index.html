          <circle cx="320" cy="370" r="15" /><text x="320" y="374" fill="#fff" font-family="Arial" font-weight="bold" font-size="11" text-anchor="middle">8</text>
          <circle cx="360" cy="530" r="15" /><text x="360" y="534" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">RWB</text>
          <circle cx="480" cy="230" r="15" /><text x="480" y="234" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">10</text>
          <circle class="anim-st" cx="580" cy="310" r="15" /><text class="anim-st" x="580" y="314" fill="#fff" font-family="Arial" font-weight="bold" font-size="11" text-anchor="middle">9</text>
          <circle cx="480" cy="450" r="15" /><text x="480" y="454" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">11</text>
        </g>

        <circle class="ball anim-ball" cx="810" cy="340" r="7" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
      </svg>
    `;

    function parseKeywords(text) {
      return text.replace(/(#[A-ZĄĆĘŁŃÓŚŹŻ_]+)/g, '<span class="wytrych-tag">$1</span>');
    }

    function buildMenu() {
      const menuContainer = document.getElementById('menu-container');
      const mobileMenu = document.getElementById('mobile-menu');

      globalData.forEach((pos, index) => {
        const btn = document.createElement('button');
        btn.className = 'w-full text-left px-4 py-3 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:bg-slate-800 hover:text-white menu-btn flex items-center';
        let icon = pos.id_pozycji === 'zespol' ? '<i class="fa-solid fa-users text-pink-500 w-5"></i>' : '<i class="fa-regular fa-user text-cyan-500 w-5"></i>';
        
        btn.innerHTML = `${icon} <span class="ml-2">${pos.nazwa}</span>`;
        btn.onclick = () => {
          setActiveMenu(index);
          loadPlayer(index);
        };
        menuContainer.appendChild(btn);

        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = pos.nazwa;
        mobileMenu.appendChild(opt);
      });

      mobileMenu.addEventListener('change', (e) => {
        const idx = e.target.value;
        setActiveMenu(idx);
        loadPlayer(idx);
      });
    }

    function setActiveMenu(index) {
      const btns = document.querySelectorAll('.menu-btn');
      btns.forEach((b, i) => {
        if (i == index) {
          b.classList.add('bg-slate-800', 'text-white', 'shadow-md');
          b.classList.remove('text-slate-400');
        } else {
          b.classList.remove('bg-slate-800', 'text-white', 'shadow-md');
          b.classList.add('text-slate-400');
        }
      });
      document.getElementById('mobile-menu').value = index;
    }

    function loadPlayer(index) {
      const player = globalData[index];
      if(!player) return;

      document.getElementById('pos-id').innerHTML = player.id_pozycji === 'zespol' ? '<i class="fa-solid fa-users mr-1"></i> Zespół' : '<i class="fa-solid fa-user-astronaut mr-1"></i> Rola: ' + player.id_pozycji.toUpperCase();
      document.getElementById('pos-name').textContent = player.nazwa;
      document.getElementById('pos-numbers').textContent = player.numery;
      document.getElementById('pos-anim-desc').innerHTML = parseKeywords(player.opis_animacji);

      document.getElementById('animation-container').innerHTML = fullPitchSvg;

      document.getElementById('gps-dist').textContent = player.obciazenia_gps.dystans_km;
      document.getElementById('gps-hsr').textContent = player.obciazenia_gps.hsr_m;
      document.getElementById('gps-sprint').textContent = player.obciazenia_gps.sprinty_m;
      document.getElementById('gps-spec').innerHTML = parseKeywords(player.obciazenia_gps.specyfika);

      const defUl = document.getElementById('list-defense');
      defUl.innerHTML = '';
      player.taktyka_obrona.forEach(item => {
        const li = document.createElement('li');
        li.className = "flex items-start leading-relaxed";
        li.innerHTML = `<i class="fa-solid fa-check text-cyan-500 mt-1.5 mr-3 text-xs opacity-75 flex-shrink-0"></i> <span>${parseKeywords(item)}</span>`;
        defUl.appendChild(li);
      });

      const attUl = document.getElementById('list-attack');
      attUl.innerHTML = '';
      player.taktyka_atak.forEach(item => {
        const li = document.createElement('li');
        li.className = "flex items-start leading-relaxed";
        li.innerHTML = `<i class="fa-solid fa-bolt text-emerald-500 mt-1.5 mr-3 text-xs opacity-75 flex-shrink-0"></i> <span>${parseKeywords(item)}</span>`;
        attUl.appendChild(li);
      });
    }

    window.onload = () => {
      buildMenu();
      loadPlayer(0);
    };
  </script>
</body>
</html>

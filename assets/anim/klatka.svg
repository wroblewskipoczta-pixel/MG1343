<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Płynne animacje przesunięcia całego zespołu przy pułapce pressingowej */
      @keyframes team-shift {
        0%, 20% { transform: translate(0, 0); }
        45%, 80% { transform: translate(40px, -25px); }
        100% { transform: translate(0, 0); }
      }
      @keyframes ball-action {
        0%, 20% { transform: translate(0, 0); }
        40%, 80% { transform: translate(120px, -90px); }
        100% { transform: translate(120px, -90px); opacity: 0; }
      }
      @keyframes zone-pulse {
        0%, 35% { opacity: 0; }
        40%, 85% { opacity: 1; }
        100% { opacity: 0; }
      }

      .anim-shift { animation: team-shift 7s infinite ease-in-out; }
      .anim-ball { animation: ball-action 7s infinite ease-in-out; }
      .anim-zone { animation: zone-pulse 7s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Białe tło boiska -->
  <rect x="0" y="0" width="1000" height="650" fill="#ffffff" />
  
  <!-- Czarne linie pełnego boiska -->
  <!-- Obrys boiska -->
  <rect x="50" y="50" width="900" height="550" stroke="#0f172a" stroke-width="3" fill="none" />
  <!-- Linia środkowa -->
  <line x1="500" y1="50" x2="500" y2="600" stroke="#0f172a" stroke-width="2" />
  <!-- Koło środkowe -->
  <circle cx="500" cy="325" r="75" stroke="#0f172a" stroke-width="2" fill="none" />
  <circle cx="500" cy="325" r="4" fill="#0f172a" />
  
  <!-- Pole karne lewe -->
  <rect x="50" y="185" width="130" height="280" stroke="#0f172a" stroke-width="2" fill="none" />
  <!-- Pole karne prawe -->
  <rect x="820" y="185" width="130" height="280" stroke="#0f172a" stroke-width="2" fill="none" />

  <!-- Podświetlona strefa #KLATKA na skrzydle -->
  <g class="anim-zone">
    <rect x="620" y="80" width="180" height="130" rx="8" fill="#15803d" fill-opacity="0.2" stroke="#15803d" stroke-width="2" stroke-dasharray="6,6" />
    <text x="710" y="150" fill="#15803d" font-family="Arial, sans-serif" font-weight="900" font-size="24" text-anchor="middle">#KLATKA</text>
  </g>


  <!-- PRZECIWNIK (Czerwone kropki - ustawienie w budowie gry) -->
  <g fill="#dc2626" stroke="#0f172a" stroke-width="1.5">
    <!-- Bramkarz -->
    <circle cx="900" cy="325" r="14" /><text x="900" y="329" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">BR</text>
    <!-- Obrońcy -->
    <circle cx="780" cy="220" r="14" /><text x="780" y="224" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">SO</text>
    <circle cx="780" cy="430" r="14" /><text x="780" y="434" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">SO</text>
    <circle cx="680" cy="110" r="14" /><text x="680" y="114" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">BO</text>
    <circle cx="680" cy="540" r="14" /><text x="680" y="544" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">BO</text>
    <!-- Pomocnicy -->
    <circle cx="620" cy="270" r="14" /><text x="620" y="274" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">P</text>
    <circle cx="620" cy="380" r="14" /><text x="620" y="384" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">P</text>
    <circle cx="500" cy="325" r="14" /><text x="500" y="329" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">ŚP</text>
    <!-- Napastnicy -->
    <circle cx="420" cy="260" r="14" /><text x="420" y="264" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">N</text>
    <circle cx="420" cy="390" r="14" /><text x="420" y="394" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">N</text>
  </g>


  <!-- NASz ZESPÓŁ: OLIMPIA GRUDZIĄDZ (System 1-3-4-3 na pełnym boisku) -->
  <g fill="#15803d" stroke="#0f172a" stroke-width="1.5" class="anim-shift">
    <!-- 1 - Bramkarz -->
    <circle cx="100" cy="325" r="15" /><text x="100" y="329" fill="#fff" font-family="Arial" font-weight="bold" font-size="11" text-anchor="middle">1</text>
    
    <!-- Trójka Stoperów (3, 5, 2) - Rest Defense -->
    <circle cx="220" cy="220" r="15" /><text x="220" y="224" fill="#fff" font-family="Arial" font-weight="bold" font-size="11" text-anchor="middle">3</text>
    <circle cx="200" cy="325" r="15" /><text x="200" y="329" fill="#fff" font-family="Arial" font-weight="bold" font-size="11" text-anchor="middle">5</text>
    <circle cx="220" cy="430" r="15" /><text x="220" y="434" fill="#fff" font-family="Arial" font-weight="bold" font-size="11" text-anchor="middle">2</text>

    <!-- Pomoc i Wahadła (LWB, 6, 8, RWB) -->
    <circle cx="360" cy="120" r="15" /><text x="360" y="124" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">LWB</text>
    <circle cx="320" cy="280" r="15" /><text x="320" y="284" fill="#fff" font-family="Arial" font-weight="bold" font-size="11" text-anchor="middle">6</text>
    <circle cx="320" cy="370" r="15" /><text x="320" y="374" fill="#fff" font-family="Arial" font-weight="bold" font-size="11" text-anchor="middle">8</text>
    <circle cx="360" cy="530" r="15" /><text x="360" y="534" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">RWB</text>

    <!-- Trójka Ataku (10, 9, 11) -->
    <circle cx="480" cy="200" r="15" /><text x="480" y="204" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">10</text>
    <circle cx="560" cy="325" r="15" /><text x="560" y="329" fill="#fff" font-family="Arial" font-weight="bold" font-size="11" text-anchor="middle">9</text>
    <circle cx="480" cy="450" r="15" /><text x="480" y="454" fill="#fff" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle">11</text>
  </g>

  <!-- Piłka (Przemieszczająca się do bocznego sektora) -->
  <circle class="ball anim-ball" cx="770" cy="240" r="7" fill="#0f172a" stroke="#ffffff" stroke-width="2" />

</svg>
